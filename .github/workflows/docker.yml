name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        run: |
          docker build \
            -t ghcr.io/bendaviddev/banking-backend:latest \
            -t ghcr.io/bendaviddev/banking-backend:${{ github.sha }} \
            BankingSystemAPI
          docker push --all-tags ghcr.io/bendaviddev/banking-backend
      - name: Build and push frontend image
        run: |
          docker build \
            -t ghcr.io/bendaviddev/banking-frontend:latest \
            -t ghcr.io/bendaviddev/banking-frontend:${{ github.sha }} \
            banking-frontend
          docker push --all-tags ghcr.io/bendaviddev/banking-frontend
