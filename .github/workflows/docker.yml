name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t banking-backend:ci BankingSystemAPI
      - name: Build frontend image
        run: docker build -t banking-frontend:ci banking-frontend
