name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BankingSystemAPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: BankingSystemAPI/target/*.jar

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: banking-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: banking-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        # Fails on critical shipped-dependency vulnerabilities. The one remaining
        # high advisory (GHSA-qwww-vcr4-c8h2) is an RSC-mode CSRF issue that does
        # not apply to this client-side SPA and has no upstream fix yet.
        run: npm audit --omit=dev --audit-level=critical
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: banking-frontend/dist
